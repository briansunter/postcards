name: Run npm tests on PR
on: pull_request
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install
      run: npm ci --legacy-peer-deps

    - name: build
      run: npm run build

    - name: Test
      run: npm run test -- --watchAll=false
